name: Ape X Generator Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-generators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator scripts
        run: python -m py_compile tools/generate_project.py tools/generate_ios_project.py tests/test_generators.py
      - name: Run generator smoke tests
        run: python -m unittest discover -s tests -v
