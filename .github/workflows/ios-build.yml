name: Ape X iOS Build

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Ape X build spec (JSON)"
        required: true
      build_id:
        description: "Ape X build ID"
        required: true

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Write build spec
        env:
          SPEC: ${{ inputs.spec }}
        run: printf '%s' "$SPEC" > spec.json

      - name: Generate iOS project
        run: |
          brew install xcodegen
          python3 tools/generate_ios_project.py spec.json ios
          cd ios && xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA and Xcode project
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry App-unsigned.ipa Payload && rm -rf Payload)
          rm -rf ios/build
          zip -qry out/App-xcode-project.zip ios
          ls -la out

      # Signing layer (separate): runs only when Apple credentials are added
      # as repository secrets. Without them the unsigned IPA is the result.
      - name: Signing (optional)
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: echo "Apple signing credentials detected — signing step to be configured."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-${{ inputs.build_id }}
          path: out/*
