name: Ape X iOS Build

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Ape X build spec (JSON)"
        required: true
        type: string
      build_id:
        description: "Ape X build ID"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Test project generators
        run: python3 -m unittest discover -s tests -v

      - name: Validate build request and write spec
        env:
          SPEC: ${{ inputs.spec }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          python3 - <<'PY'
          import json, os, re
          spec = json.loads(os.environ["SPEC"])
          if not isinstance(spec, dict):
              raise SystemExit("Build spec must be a JSON object")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", os.environ["BUILD_ID"]):
              raise SystemExit("build_id may contain only letters, digits, dot, underscore, and hyphen (max 80 chars)")
          with open("spec.json", "w", encoding="utf-8") as f:
              json.dump(spec, f)
          PY

      - name: Generate iOS project
        run: |
          brew install xcodegen
          python3 tools/generate_ios_project.py spec.json ios
          cd ios && xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA and Xcode project
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry App-unsigned.ipa Payload && rm -rf Payload)
          rm -rf ios/build
          zip -qry out/App-xcode-project.zip ios
          ls -la out

      # Signing layer (separate): runs only when Apple credentials are added
      # as repository secrets. Without them the unsigned IPA is the result.
      - name: Signing (optional)
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: echo "Apple signing credentials detected — signing step to be configured."

      - name: Verify generated artifacts
        run: |
          set -euo pipefail
          test -s out/App-unsigned.ipa
          test -s out/App-xcode-project.zip
          unzip -t out/App-unsigned.ipa
          unzip -t out/App-xcode-project.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-${{ inputs.build_id }}-ios-unsigned
          if-no-files-found: error
          retention-days: 7
          path: out/*
