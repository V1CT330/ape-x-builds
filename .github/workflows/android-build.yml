name: Ape X Android Build

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Ape X build spec (JSON)"
        required: true
      build_id:
        description: "Ape X build ID"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Write build spec
        env:
          SPEC: ${{ inputs.spec }}
        run: printf '%s' "$SPEC" > spec.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        env:
          SDK: ${{ env.ANDROID_HOME }}
        run: python3 tools/generate_project.py spec.json app

      # A production keystore must include its matching password and alias secrets.
      # Without a production keystore, create a throwaway key for test builds only.
      - name: Prepare signing key
        working-directory: app/app
        shell: bash
        run: |
          if [ -n "$APEX_KEYSTORE_B64" ]; then
            for secret_name in APEX_KEYSTORE_PASSWORD APEX_KEY_ALIAS APEX_KEY_PASSWORD; do
              if [ -z "${!secret_name}" ]; then
                echo "::error::APEX_KEYSTORE_B64 is set but $secret_name is missing. Configure all four signing secrets."
                exit 1
              fi
            done
            printf '%s' "$APEX_KEYSTORE_B64" | base64 --decode > apex.keystore
            if [ ! -s apex.keystore ]; then
              echo "::error::APEX_KEYSTORE_B64 did not decode to a non-empty keystore."
              exit 1
            fi
          else
            echo "::warning::No production keystore configured. This build will use a temporary test signing key and is not suitable for production updates."
            keytool -genkeypair -keystore apex.keystore -storepass apexbuild -keypass apexbuild -alias apex -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ape X Test"
            {
              echo "APEX_KEYSTORE_PASSWORD=apexbuild"
              echo "APEX_KEY_ALIAS=apex"
              echo "APEX_KEY_PASSWORD=apexbuild"
            } >> "$GITHUB_ENV"
          fi

      - name: Build artifact
        working-directory: app
        run: |
          ARTIFACT=$(python3 -c "import json;print(json.load(open('../spec.json')).get('artifact','apk'))")
          if [ "$ARTIFACT" = "aab" ]; then
            gradle --no-daemon bundleRelease
          elif [ "$ARTIFACT" = "apk" ]; then
            gradle --no-daemon assembleRelease
          else
            echo "::error::Unsupported artifact type '$ARTIFACT'. Use 'apk' or 'aab'."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ inputs.build_id }}
          if-no-files-found: error
          path: |
            app/app/build/outputs/apk/release/*.apk
            app/app/build/outputs/bundle/release/*.aab
